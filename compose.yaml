name: 'game_dwh'

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.11.2}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/sql:/opt/airflow/sql

  user: "${AIRFLOW_UID:-50000}:0"

  networks:
    - game_network

  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

networks:
  game_network:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: dwh_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - game_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d game_dwh" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

  airflow-init:
    <<: *airflow-common

    container_name: airflow_init
    command: version

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow_webserver
    command: webserver

    ports:
      - "8080:8080"

    restart: always

    networks:
      - game_network

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler

    restart: always

    networks:
      - game_network

  superset:
    image: apache/superset:3.0.1
    container_name: dwh_superset

    ports:
      - "8088:8088"

    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}

    volumes:
      - superset_data:/app/superset_home

    networks:
      - game_network

    command: >
      sh -c "superset db upgrade && superset fab create-admin --username ${SUPERSET_ADMIN_USERNAME} --firstname Admin --lastname Admin --email admin@localhost --password ${SUPERSET_ADMIN_PASSWORD} && superset init && superset run -p 8088 -h 0.0.0.0 --with-threads"

    restart: always

volumes:
  postgres_data:
  superset_data:
